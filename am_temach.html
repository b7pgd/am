<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Temach</title>

    <style>
        * {

        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            height: 50px;
            display: flex;
            align-items: center;

            background: #222;
            color: white;

        iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
